name: Release

# Publishes @kdctek/n8n-nodes-wacr to npm.
#
# n8n requires that ALL community nodes submitted for verification are published
# by a GitHub action and carry a provenance statement (rule in force since
# 2026-05-01). Publishing from a local machine disqualifies the package, so
# `npm publish` must never be run by hand — tag a release and let this run.
#
# TWO-PHASE BOOTSTRAP — npm cannot publish a package's FIRST version over OIDC,
# because trusted publishing can only be configured on a package that already
# exists.
#
#   Phase 1 (first release only): set the NPM_TOKEN repo secret to a granular
#     access token scoped to this package, owned by npm user `dezinenija` under
#     the `kdctek` org. This job publishes with --provenance, satisfying n8n.
#
#   Phase 2 (every release after): on npmjs.com → package → Settings → Trusted
#     publishing, add this repo + workflow, and explicitly tick the allowed
#     action (configs created after 2026-05-20 no longer default to "publish").
#     Then DELETE the NPM_TOKEN secret. OIDC takes over automatically and
#     generates provenance on its own — nothing here needs to change.
#
# Release: bump the version in package.json, roll CHANGELOG.md, then
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 + npm 11: trusted publishing needs npm >= 11.5.1, and Node 22
      # still ships npm 10.x. package.json `engines` stays at >=20.15 — that is
      # the floor for n8n hosts consuming the node, not for this build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11

      - run: npm ci

      # Tag and manifest must agree, or npm publishes a version nobody tagged.
      # Skipped on workflow_dispatch, where there is no tag to compare against.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # The AGENTS.md verify gate, in full. `prepublishOnly` reruns the build and
      # the strict lint at publish time; running them here fails the release
      # before anything reaches the registry.
      - run: npm run lint
      - run: npx eslint -c .eslintrc.prepublish.js nodes credentials package.json
      - run: npx tsc --noEmit
      - run: npm test

      # --access public is required for a scoped package's first publish.
      # --provenance is needed while publishing with a token; once trusted
      # publishing is on, provenance is automatic and the flag is a no-op.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
